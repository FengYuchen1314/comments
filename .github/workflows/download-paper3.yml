name: Resolve open copy of paper 3

on:
  push:
    paths:
      - '.github/workflows/download-paper3.yml'

permissions:
  contents: read

jobs:
  resolve:
    if: github.event.head_commit.message == 'resolve paper 3'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Query lawful open-access indexes and verify candidates
        shell: bash
        run: |
          set -u
          mkdir -p result work
          : > result/candidates.txt
          : > result/status.txt

          if ! command -v pdfinfo >/dev/null 2>&1 || ! command -v pdftotext >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq poppler-utils
          fi

          DOI='10.1111/1467-9868.00294'
          TITLE_PATTERN='Bayesian Calibration of Computer Models|Bayesian calibration of computer models'

          curl -LfsS --retry 3 --get 'https://api.openalex.org/works' \
            --data-urlencode "filter=doi:${DOI}" \
            --data-urlencode 'per-page=1' \
            -o result/openalex.json || echo '{}' > result/openalex.json

          curl -LfsS --retry 3 "https://api.unpaywall.org/v2/${DOI}?email=research@example.com" \
            -o result/unpaywall.json || echo '{}' > result/unpaywall.json

          curl -LfsS --retry 3 "https://api.semanticscholar.org/graph/v1/paper/DOI:${DOI}?fields=title,openAccessPdf,url,externalIds" \
            -o result/semantic-scholar.json || echo '{}' > result/semantic-scholar.json

          curl -LfsS --retry 3 "https://api.crossref.org/works/${DOI}" \
            -o result/crossref.json || echo '{}' > result/crossref.json

          {
            jq -r '.results[0].content_urls.pdf // empty' result/openalex.json 2>/dev/null || true
            jq -r '.results[0].best_oa_location.pdf_url // empty' result/openalex.json 2>/dev/null || true
            jq -r '.results[0].primary_location.pdf_url // empty' result/openalex.json 2>/dev/null || true
            jq -r '.results[0].locations[]?.pdf_url // empty' result/openalex.json 2>/dev/null || true
            jq -r '.best_oa_location.url_for_pdf // empty' result/unpaywall.json 2>/dev/null || true
            jq -r '.oa_locations[]?.url_for_pdf // empty' result/unpaywall.json 2>/dev/null || true
            jq -r '.openAccessPdf.url // empty' result/semantic-scholar.json 2>/dev/null || true
            jq -r '.message.link[]? | select(."content-type" == "application/pdf") | .URL' result/crossref.json 2>/dev/null || true
            printf '%s\n' \
              'https://academic.oup.com/jrsssb/article-pdf/63/3/425/49590547/jrsssb_63_3_425.pdf' \
              'https://rss.onlinelibrary.wiley.com/doi/pdf/10.1111/1467-9868.00294'
          } | sed '/^[[:space:]]*$/d' | awk '!seen[$0]++' > result/candidates.txt

          echo 'OpenAlex selected fields:'
          jq '{id: .results[0].id, open_access: .results[0].open_access, content_urls: .results[0].content_urls, best_oa_location: .results[0].best_oa_location, primary_location: .results[0].primary_location, locations: [.results[0].locations[]? | {landing_page_url,pdf_url,license,is_oa,source}]}' result/openalex.json 2>/dev/null || true
          echo 'Unpaywall selected fields:'
          jq '{is_oa,oa_status,best_oa_location,oa_locations}' result/unpaywall.json 2>/dev/null || true
          echo 'Semantic Scholar selected fields:'
          jq . result/semantic-scholar.json 2>/dev/null || true
          echo 'Candidate URLs:'
          cat result/candidates.txt

          found=0
          while IFS= read -r url; do
            [ -n "$url" ] || continue
            echo "Trying: $url"
            rm -f work/candidate.pdf work/candidate.txt
            if curl -L --fail --show-error --silent --retry 2 --retry-all-errors \
                 --connect-timeout 20 --max-time 300 \
                 -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131 Safari/537.36' \
                 -H 'Accept: application/pdf,*/*;q=0.8' \
                 "$url" -o work/candidate.pdf; then
              if [ "$(head -c 5 work/candidate.pdf 2>/dev/null)" = '%PDF-' ] \
                 && pdfinfo work/candidate.pdf >/dev/null 2>&1; then
                pdftotext -f 1 -l 3 work/candidate.pdf work/candidate.txt 2>/dev/null || true
                if grep -Eiq "$TITLE_PATTERN" work/candidate.txt; then
                  mv work/candidate.pdf result/3.pdf
                  pages="$(pdfinfo result/3.pdf | awk -F: '/^Pages:/ {gsub(/[[:space:]]/,"",$2); print $2}')"
                  bytes="$(stat -c '%s' result/3.pdf)"
                  sha="$(sha256sum result/3.pdf | awk '{print $1}')"
                  printf 'FOUND\nsource=%s\npages=%s\nbytes=%s\nsha256=%s\n' "$url" "$pages" "$bytes" "$sha" > result/status.txt
                  found=1
                  break
                fi
              fi
            fi
          done < result/candidates.txt

          if [ "$found" -eq 0 ]; then
            printf 'NOT_FOUND\nNo lawful open full-text PDF was identified by OpenAlex, Unpaywall, Semantic Scholar, Crossref, or the publisher endpoints.\n' > result/status.txt
          fi
          cat result/status.txt

      - name: Upload resolution result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-3-resolution
          path: result/
          if-no-files-found: error
          retention-days: 1
