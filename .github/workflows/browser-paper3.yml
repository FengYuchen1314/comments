name: Verify browser access for paper 3

on:
  push:
    paths:
      - '.github/workflows/browser-paper3.yml'

permissions:
  contents: read

jobs:
  verify-browser-access:
    if: github.event.head_commit.message == 'verify browser access paper 3'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check normal unauthenticated browser access
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p result downloads
          pip -q install selenium requests
          if ! command -v pdfinfo >/dev/null 2>&1 || ! command -v pdftotext >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq poppler-utils
          fi
          cat > /tmp/check.py <<'PY'
          import json, os, pathlib, time
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options

          root = pathlib.Path.cwd()
          out = root / 'result'
          downloads = root / 'downloads'
          out.mkdir(exist_ok=True)
          downloads.mkdir(exist_ok=True)

          landing = 'https://academic.oup.com/jrsssb/article/63/3/425/7083367'
          pdf = 'https://academic.oup.com/jrsssb/article-pdf/63/3/425/49590547/jrsssb_63_3_425.pdf'

          opts = Options()
          opts.add_argument('--headless=new')
          opts.add_argument('--no-sandbox')
          opts.add_argument('--disable-dev-shm-usage')
          opts.add_argument('--disable-gpu')
          opts.add_argument('--window-size=1440,1600')
          opts.add_argument('--user-agent=Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131 Safari/537.36')
          opts.add_experimental_option('prefs', {
              'download.default_directory': str(downloads),
              'download.prompt_for_download': False,
              'download.directory_upgrade': True,
              'plugins.always_open_pdf_externally': True,
              'safebrowsing.enabled': True,
          })
          driver = webdriver.Chrome(options=opts)
          driver.execute_cdp_cmd('Page.setDownloadBehavior', {'behavior': 'allow', 'downloadPath': str(downloads)})
          status = {'landing_url': landing, 'pdf_url': pdf}
          try:
              driver.get(landing)
              time.sleep(4)
              status['landing_final_url'] = driver.current_url
              status['landing_title'] = driver.title
              text = driver.find_element('tag name', 'body').text
              (out / 'landing_text.txt').write_text(text, encoding='utf-8')
              status['access_denial_detected'] = any(x.lower() in text.lower() for x in [
                  'you do not currently have access', 'get access', 'purchase', 'institutional access'
              ])
              status['cookies'] = [c['name'] for c in driver.get_cookies()]

              driver.get(pdf)
              time.sleep(10)
              status['pdf_final_url'] = driver.current_url
              status['pdf_page_title'] = driver.title
              try:
                  body = driver.find_element('tag name', 'body').text
              except Exception:
                  body = ''
              (out / 'pdf_page_text.txt').write_text(body, encoding='utf-8')
              status['downloaded_files'] = [p.name for p in downloads.iterdir()]
          finally:
              driver.quit()
          (out / 'browser_status.json').write_text(json.dumps(status, indent=2), encoding='utf-8')
          print(json.dumps(status, indent=2))
          PY
          python /tmp/check.py || true

          found=''
          for f in downloads/*; do
            [ -f "$f" ] || continue
            if [ "$(head -c 5 "$f" 2>/dev/null)" = '%PDF-' ] && pdfinfo "$f" >/dev/null 2>&1; then
              pdftotext -f 1 -l 3 "$f" /tmp/paper.txt 2>/dev/null || true
              if grep -Eiq 'Bayesian Calibration of Computer Models|Bayesian calibration of computer models' /tmp/paper.txt; then
                cp "$f" result/3.pdf
                found=1
                break
              fi
            fi
          done
          if [ -n "$found" ]; then
            {
              echo FOUND
              pdfinfo result/3.pdf | grep -E '^(Pages|File size):'
              sha256sum result/3.pdf
            } > result/status.txt
          else
            echo 'NOT_FOUND_BY_NORMAL_UNAUTHENTICATED_BROWSER' > result/status.txt
          fi
          cat result/status.txt

      - name: Upload browser-check result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-3-browser-check
          path: result/
          if-no-files-found: error
          retention-days: 1
