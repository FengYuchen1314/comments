name: Download math and machine-learning papers

on:
  push:
    paths:
      - '.github/workflows/download-papers.yml'

permissions:
  contents: read

jobs:
  download:
    if: github.event.head_commit.message == 'download papers'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download, identify, and verify PDFs
        shell: bash
        run: |
          set -u
          mkdir -p papers work
          : > papers/manifest.tsv
          : > papers/MISSING.txt
          printf 'filename\ttitle\tsource_url\tbytes\tpages\tsha256\n' > papers/manifest.tsv

          if ! command -v pdfinfo >/dev/null 2>&1 || ! command -v pdftotext >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq poppler-utils
          fi

          download_pdf() {
            n="$1"
            title="$2"
            pattern="$3"
            shift 3
            target="papers/${n}.pdf"
            rm -f "$target" "work/${n}.tmp" "work/${n}.txt"

            for url in "$@"; do
              echo "[$n] Trying: $url"
              rm -f "work/${n}.tmp" "work/${n}.txt"
              if curl -L --fail --show-error --silent \
                   --retry 3 --retry-all-errors --connect-timeout 25 --max-time 360 \
                   -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131 Safari/537.36' \
                   -H 'Accept: application/pdf,*/*;q=0.8' \
                   "$url" -o "work/${n}.tmp"; then
                if [ "$(head -c 5 "work/${n}.tmp" 2>/dev/null)" = '%PDF-' ] \
                   && pdfinfo "work/${n}.tmp" >/dev/null 2>&1; then
                  pdftotext -f 1 -l 3 "work/${n}.tmp" "work/${n}.txt" 2>/dev/null || true
                  if grep -Eiq "$pattern" "work/${n}.txt"; then
                    mv "work/${n}.tmp" "$target"
                    pages="$(pdfinfo "$target" | awk -F: '/^Pages:/ {gsub(/[[:space:]]/,"",$2); print $2}')"
                    bytes="$(stat -c '%s' "$target")"
                    sha="$(sha256sum "$target" | awk '{print $1}')"
                    clean_title="$(printf '%s' "$title" | tr '\t\n\r' '   ')"
                    printf '%s.pdf\t%s\t%s\t%s\t%s\t%s\n' "$n" "$clean_title" "$url" "$bytes" "$pages" "$sha" >> papers/manifest.tsv
                    echo "[$n] OK: ${pages} pages, ${bytes} bytes"
                    return 0
                  else
                    echo "[$n] PDF title check failed for $url"
                  fi
                else
                  echo "[$n] Not a valid PDF: $url"
                fi
              else
                echo "[$n] Download failed: $url"
              fi
            done

            printf '%s.pdf\t%s\n' "$n" "$title" >> papers/MISSING.txt
            echo "[$n] FAILED all legal sources" >&2
            return 0
          }

          download_pdf 1 \
            'Transformer Neural Processes: Uncertainty-Aware Meta Learning Via Sequence Modeling' \
            'Transformer Neural Processes|Uncertainty-Aware Meta Learning' \
            'https://proceedings.mlr.press/v162/nguyen22b/nguyen22b.pdf' \
            'https://arxiv.org/pdf/2207.04179.pdf'

          download_pdf 2 \
            'Learning Nonlinear Operators via DeepONet Based on the Universal Approximation Theorem of Operators' \
            'Learning Nonlinear Operators|DeepONet' \
            'https://arxiv.org/pdf/1910.03193.pdf'

          download_pdf 3 \
            'Bayesian Calibration of Computer Models' \
            'Bayesian Calibration of Computer Models|Bayesian calibration of computer models' \
            'https://academic.oup.com/jrsssb/article-pdf/63/3/425/49590547/jrsssb_63_3_425.pdf' \
            'https://rss.onlinelibrary.wiley.com/doi/pdf/10.1111/1467-9868.00294'

          download_pdf 4 \
            'Deep Set Based Operator Learning with Uncertainty Quantification' \
            'Deep Set Based Operator Learning|Operator Learning with Uncertainty Quantification' \
            'https://arxiv.org/pdf/2509.25646.pdf'

          download_pdf 5 \
            'Adjustments to Computer Models via Projected Kernel Calibration' \
            'Adjustments to Computer Models|Projected Kernel Calibration' \
            'https://arxiv.org/pdf/1705.03422.pdf'

          download_pdf 6 \
            'On the Optimal Reconstruction of Partially Observed Functional Data' \
            'Optimal Reconstruction of Partially Observed Functional Data|Partially Observed Functional Data' \
            'https://arxiv.org/pdf/1710.10099.pdf'

          download_pdf 7 \
            'Neural Operator Processes for Probabilistic Operator Learning under Partial Observations' \
            'Neural Operator Processes|Probabilistic Operator Learning' \
            'https://arxiv.org/pdf/2606.22946.pdf'

          download_pdf 8 \
            'PACOH: Bayes-Optimal Meta-Learning with PAC-Guarantees' \
            'PACOH|Bayes-Optimal Meta-Learning' \
            'https://proceedings.mlr.press/v139/rothfuss21a/rothfuss21a.pdf' \
            'https://arxiv.org/pdf/2002.05551.pdf'

          download_pdf 9 \
            'Functional Data Analysis for Sparse Longitudinal Data' \
            'Functional Data Analysis for Sparse Longitudinal Data|Sparse Longitudinal Data' \
            'https://utstat.utoronto.ca/fyao/2005-jasa.pdf'

          download_pdf 10 \
            'Near-Optimal Sensor Placements in Gaussian Processes: Theory, Efficient Algorithms and Empirical Studies' \
            'Near-Optimal Sensor Placements|Sensor Placements in Gaussian Processes' \
            'https://jmlr.org/papers/volume9/krause08a/krause08a.pdf' \
            'https://www.jmlr.org/papers/volume9/krause08a/krause08a.pdf'

          cat > papers/README.txt <<'EOF'
          Mathematics / Statistics / Machine-Learning Papers

          1.pdf  Transformer Neural Processes: Uncertainty-Aware Meta Learning Via Sequence Modeling
          2.pdf  Learning Nonlinear Operators via DeepONet Based on the Universal Approximation Theorem of Operators
          3.pdf  Bayesian Calibration of Computer Models
          4.pdf  Deep Set Based Operator Learning with Uncertainty Quantification
          5.pdf  Adjustments to Computer Models via Projected Kernel Calibration
          6.pdf  On the Optimal Reconstruction of Partially Observed Functional Data
          7.pdf  Neural Operator Processes for Probabilistic Operator Learning under Partial Observations
          8.pdf  PACOH: Bayes-Optimal Meta-Learning with PAC-Guarantees
          9.pdf  Functional Data Analysis for Sparse Longitudinal Data
          10.pdf Near-Optimal Sensor Placements in Gaussian Processes: Theory, Efficient Algorithms and Empirical Studies

          Each PDF was checked for a valid PDF header, readable metadata, nonzero page count,
          and matching title text. See manifest.tsv for source URLs, sizes, page counts, and SHA-256 hashes.
          EOF
          sed -i 's/^          //' papers/README.txt

          if [ ! -s papers/MISSING.txt ]; then
            rm papers/MISSING.txt
          fi

          files=(papers/[0-9]*.pdf papers/README.txt papers/manifest.tsv)
          if [ -f papers/MISSING.txt ]; then files+=(papers/MISSING.txt); fi
          zip -9 -j papers/papers_1-10.zip "${files[@]}"
          ls -lh papers
          cat papers/manifest.tsv
          if [ -f papers/MISSING.txt ]; then
            echo 'Missing files:'
            cat papers/MISSING.txt
          fi

      - name: Upload verified papers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: math-ml-papers-1-10
          path: papers/
          if-no-files-found: error
          retention-days: 1

      - name: Require all ten PDFs
        shell: bash
        run: |
          if [ -s papers/MISSING.txt ]; then
            echo 'One or more PDFs could not be obtained from the listed legal sources.' >&2
            cat papers/MISSING.txt >&2
            exit 1
          fi
          test "$(find papers -maxdepth 1 -name '*.pdf' | wc -l)" -eq 10
